<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepGod - Select User</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Select User</h1>
    <p>Who is logging a workout?</p>

    <div class="user-select-container">
        <button id="user-taylor" class="btn-primary user-btn">Taylor</button>
        <button id="user-adam" class="btn-primary user-btn">Adam</button>
    </div>
</main>

<script>
    if (localStorage.getItem('liftLogicAuth') !== 'true') {
        window.location.href = '/login';
    }

    function selectUser(id, name) {
        localStorage.setItem('liftLogicUserID', id);
        localStorage.setItem('liftLogicUserName', name);
        window.location.href = '/';
    }

    document.getElementById('user-taylor').addEventListener('click', () => {
        selectUser(1, 'Taylor');
    });

    document.getElementById('user-adam').addEventListener('click', () => {
        selectUser(2, 'Adam');
    });
</script>
</body>
</html>
